<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring ATK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f7fa;
        }
        .dashboard-fullscreen {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .dashboard-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .dashboard-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
        }
        .top-bar-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard-fullscreen">
        <!-- Top Bar -->
        <div class="dashboard-top-bar">
            <div class="dashboard-title">📊 Dashboard Stok ATK - Timbangan</div>
            <div class="top-bar-actions">
                <button onclick="loadDashboard()" class="btn-refresh">Refresh</button>
                <a href="/" class="nav-link">← Kembali</a>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div id="dashboardContent" class="dashboard-grid"></div>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
