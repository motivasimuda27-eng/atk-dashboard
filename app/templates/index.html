<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ATK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
                </div>
            <div class="header-text">
                <h1>Monitoring ATK </h1>
                <h2>Timbangan</h2>
                <p>Sistem Manajemen Alat Tulis Kantor</p>
                <a href="/dashboard" class="btn-dashboard-link">📊 Lihat Dashboard Monitoring</a>
            </div>
            </div>
        </header>

        <!-- Navigasi Tab -->
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('inventory')">Inventori</button>
            <button class="tab-button" onclick="showTab('report')">Laporan Bulanan</button>
        </div>

        <!-- Tab Inventori -->
        <div id="inventory" class="tab-content active">
            <div class="sub-tabs">
                <button class="sub-tab-button active" onclick="showSubTab('reservasi')">Reservasi</button>
                <button class="sub-tab-button" onclick="showSubTab('stock')">Stock</button>
            </div>
            <div id="reservasi" class="sub-tab-content active">
                <div class="section">
                    <h2>Tambah Item Baru</h2>
                    <form id="addItemForm">
                        <input type="text" id="itemMID" placeholder="Masukan MID" required>
                        <input type="text" id="itemName" placeholder="Nama ATK (misal: Pulpen Biru)" required>
                        <input type="number" id="itemStock" placeholder="Stock awal" required>
                        <input type="text" id="itemUnit" placeholder="Satuan (misal: pcs, box)" required>
                        <input type="text" id="itemStorage" placeholder="Lokasi Penyimpanan (misal: Rak A1)" required>
                        <button type="submit">Tambah Item</button>
                    </form>
                </div>

                <div class="section">
                    <h2>Reservasi Stock</h2>
                    <div class="bulk-reservation-form">
                        <div class="bulk-header">
                            <label for="bulkReservationDate" style="font-weight: 600; color: #333;">Tanggal Reservasi:</label>
                            <input type="date" id="bulkReservationDate" required style="margin-bottom: 15px;">
                        </div>
                        
                        <div id="reservationItemsContainer">
                            <!-- Rows will be added dynamically by JavaScript -->
                        </div>
                        
                        <div class="bulk-actions">
                            <button type="button" onclick="addReservationRow()" class="btn-add-row">
                                ➕ Tambah Baris
                            </button>
                            <button type="button" onclick="submitBulkReservation()" class="btn-submit-bulk">
                                💾 Simpan Semua Reservasi
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="stock" class="sub-tab-content">
                <div class="section">
                    <h2>Daftar ATK</h2>
                    
                    <!-- Search & Filter Section -->
                    <div class="search-filter-container">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="🔍 Cari berdasarkan MID atau Nama..." onkeyup="filterItems()">
                        </div>
                        
                        <div class="filter-controls">
                            <select id="sortBy" onchange="filterItems()">
                                <option value="name-asc">Nama (A-Z)</option>
                                <option value="name-desc">Nama (Z-A)</option>
                                <option value="stock-asc">Stock (Rendah-Tinggi)</option>
                                <option value="stock-desc">Stock (Tinggi-Rendah)</option>
                                <option value="mid-asc">MID (A-Z)</option>
                                <option value="location-asc">Lokasi (A-Z)</option>
                                <option value="location-desc">Lokasi (Z-A)</option>
                            </select>
                            
                            <select id="filterStock" onchange="filterItems()">
                                <option value="all">Semua Stock</option>
                                <option value="low">Stock Rendah (&lt;10)</option>
                                <option value="medium">Stock Sedang (10-50)</option>
                                <option value="high">Stock Tinggi (&gt;50)</option>
                                <option value="empty">Stock Kosong (0)</option>
                            </select>
                            
                            <button onclick="resetFilters()" class="btn-reset">Reset</button>
                        </div>
                    </div>
                    
                    <div id="itemsCount" class="items-count"></div>
                    <div id="itemsList"></div>
                </div>
            </div>
        </div>

        <!-- Tab Laporan -->
        <div id="report" class="tab-content">
            <div class="section">
                <h2>Laporan Penggunaan Bulanan</h2>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
                    <input type="month" id="reportMonth" value="">
                    <button onclick="loadReport()">Lihat Laporan</button>
                    <button onclick="exportReportCSV()" class="btn-export" style="background: #48bb78;">Export CSV</button>
                </div>
                <div id="reportContent"></div>
            </div>
        </div>
                <!-- Modal untuk Update Stock -->
        <div id="stockModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="stockModalTitle">Tambah Stok</h2>
                    <span class="close" onclick="closeStockModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <label for="stockDate" style="font-weight:600;color:#333;">Tanggal</label>
                    <input type="date" id="stockDate" required>
                    <label>Jumlah:</label>
                    <input type="number" id="stockQuantity" placeholder="Masukkan jumlah" min="1">
                </div>
                <div class="modal-footer">
                    <button onclick="closeStockModal()" class="btn-cancel">Batal</button>
                    <button onclick="confirmStock()" class="btn-confirm">Simpan</button>
                </div>
            </div>
        </div>

        <!-- Modal untuk Hapus Item -->
        <div id="deleteModal" class="modal">
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h2>Hapus Item</h2>
                    <span class="close" onclick="closeDeleteModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p id="deleteMessage">Yakin ingin menghapus item ini?</p>
                </div>
                <div class="modal-footer">
                    <button onclick="closeDeleteModal()" class="btn-cancel">Batal</button>
                    <button onclick="confirmDelete()" class="btn-delete">Hapus</button>
                </div>
            </div>
        </div>
        <!-- Modal untuk Edit Item -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Item</h2>
                    <span class="close" onclick="closeEditModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editItemId">
                    <label for="editMID">MID:</label>
                    <input type="text" id="editMID" required>
                    
                    <label for="editName">Nama Item:</label>
                    <input type="text" id="editName" required>
                    
                    <label for="editStock">Stock:</label>
                    <input type="number" id="editStock" min="0" required>
                    
                    <label for="editUnit">Satuan:</label>
                    <input type="text" id="editUnit" required>
                    
                    <label for="editStorage">Lokasi Penyimpanan:</label>
                    <input type="text" id="editStorage">
                </div>
                <div class="modal-footer">
                    <button onclick="closeEditModal()" class="btn-cancel">Batal</button>
                    <button onclick="confirmEdit()" class="btn-confirm">Simpan</button>
                </div>
            </div>
        </div>
        <!-- Modal Konfirmasi Bulk Reservation -->
        <div id="bulkConfirmModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Konfirmasi Reservasi</h2>
                    <span class="close" onclick="closeBulkConfirmModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p><strong>Tanggal:</strong> <span id="confirmDate"></span></p>
                    <table class="transactions-table" style="margin-top: 15px;">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Item</th>
                                <th>Jumlah</th>
                            </tr>
                        </thead>
                        <tbody id="confirmItemsList"></tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button onclick="closeBulkConfirmModal()" class="btn-cancel">Batal</button>
                    <button onclick="executeBulkReservation()" class="btn-confirm">Konfirmasi</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
