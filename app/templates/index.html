<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ATK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
                </div>
            <div class="header-text">
                <h1>📊 Dashboard Monitoring ATK </h1>
                <h2>Timbangan</h2>
                <p>Sistem Manajemen Alat Tulis Kantor</p>
            </div>
            </div>
        </header>

        <!-- Navigasi Tab -->
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('inventory')">Inventori</button>
            <button class="tab-button" onclick="showTab('report')">Laporan Bulanan</button>
        </div>

        <!-- Tab Inventori -->
        <div id="inventory" class="tab-content active">
            <div class="section">
                <h2>Tambah Item Baru</h2>
                <form id="addItemForm">
                    <input type="text" id="itemMID" placeholder="Masukan MID" required>
                    <input type="text" id="itemName" placeholder="Nama ATK (misal: Pulpen Biru)" required>
                    <input type="number" id="itemStock" placeholder="Stock awal" required>
                    <input type="text" id="itemUnit" placeholder="Satuan (misal: pcs, box)" required>
                    <button type="submit">Tambah Item</button>
                </form>
            </div>

            <div class="section">
                <h2>Daftar ATK</h2>
                <div id="itemsList"></div>
            </div>
        </div>

        <!-- Tab Laporan -->
        <div id="report" class="tab-content">
            <div class="section">
                <h2>Laporan Penggunaan Bulanan</h2>
                <input type="month" id="reportMonth" value="">
                <button onclick="loadReport()">Lihat Laporan</button>
                <div id="reportContent"></div>
            </div>
        </div>
                <!-- Modal untuk Update Stock -->
        <div id="stockModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="stockModalTitle">Tambah Stok</h2>
                    <span class="close" onclick="closeStockModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <label for="stockDate" style="font-weight:600;color:#333;">Tanggal</label>
                    <input type="datetime-local" id="stockDate" required>
                    <label>Jumlah:</label>
                    <input type="number" id="stockQuantity" placeholder="Masukkan jumlah" min="1">
                </div>
                <div class="modal-footer">
                    <button onclick="closeStockModal()" class="btn-cancel">Batal</button>
                    <button onclick="confirmStock()" class="btn-confirm">Simpan</button>
                </div>
            </div>
        </div>

        <!-- Modal untuk Hapus Item -->
        <div id="deleteModal" class="modal">
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h2>Hapus Item</h2>
                    <span class="close" onclick="closeDeleteModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p id="deleteMessage">Yakin ingin menghapus item ini?</p>
                </div>
                <div class="modal-footer">
                    <button onclick="closeDeleteModal()" class="btn-cancel">Batal</button>
                    <button onclick="confirmDelete()" class="btn-delete">Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
